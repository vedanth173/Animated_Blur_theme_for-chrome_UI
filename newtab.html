<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>

  <!-- Google Fonts: Big Shoulders Display (Clock), Caveat (Greeting), and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Caveat:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Video & Dimming Overlay -->
  <video id="bg-video" class="bg-video hidden" autoplay loop muted playsinline></video>
  <div id="bg-overlay" class="bg-overlay"></div>

  <!-- Top-Right Hover-Expand Bookmark Wrapper -->
  <div id="bookmark-wrapper" class="bookmark-wrapper">
    <button id="bookmark-toggle-btn" class="bookmark-toggle-btn" title="Bookmarks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="bookmark-label">Bookmark</span>
    </button>

    <div id="bookmark-bar" class="bookmark-bar">
      <a href="https://github.com" class="bookmark-item">GitHub</a>
      <a href="https://leetcode.com" class="bookmark-item">LeetCode</a>
      <a href="https://mail.google.com" class="bookmark-item">Gmail</a>
      <a href="https://linkedin.com" class="bookmark-item">LinkedIn</a>
    </div>
  </div>

  <!-- Main Centered Content -->
  <main class="container">
    <!-- 1. Frosted Glass Clock with Glass Numbers -->
    <div class="hyper-clock-wrapper">
      <div id="date-display" class="hyper-date">Monday, October 26</div>
      <div class="clock-glass-stage">
        <svg class="clock-svg" viewBox="0 0 360 105">
          <!-- Hours -->
          <text
            id="clock-hours"
            class="svg-clock-font svg-clock-glass"
            x="160"
            y="90"
            text-anchor="end"
          >
            00
          </text>

          <!-- Centered Circular Colon Dots -->
          <circle class="svg-clock-glass" cx="180" cy="42" r="5" />
          <circle class="svg-clock-glass" cx="180" cy="64" r="5" />

          <!-- Minutes -->
          <text
            id="clock-mins"
            class="svg-clock-font svg-clock-glass"
            x="200"
            y="90"
            text-anchor="start"
          >
            00
          </text>
        </svg>
      </div>
    </div>

    <!-- 2. Frosted Glass Search Bar -->
    <form id="search-form" class="glass-search-box" action="https://www.google.com/search" method="GET">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="search-input"
        name="q"
        class="glass-input"
        placeholder="Search Google or type a URL..."
        autocomplete="off"
      />
    </form>

    <!-- 3. Frosted Glass Shortcuts Grid (Updated Order) -->
    <div class="shortcuts-grid">
      <a href="https://www.youtube.com" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube" />
        </div>
        <span class="tile-title">YouTube</span>
      </a>

      <a href="https://gemini.google.com" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64" alt="Gemini" />
        </div>
        <span class="tile-title">Gemini</span>
      </a>

      <a href="https://chat.openai.com" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64" alt="ChatGPT" />
        </div>
        <span class="tile-title">ChatGPT</span>
      </a>

      <a href="https://web.whatsapp.com" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=whatsapp.com&sz=64" alt="WhatsApp" />
        </div>
        <span class="tile-title">WhatsApp</span>
      </a>

      <a href="https://www.flipkart.com" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=flipkart.com&sz=64" alt="Flipkart" />
        </div>
        <span class="tile-title">Flipkart</span>
      </a>

      <a href="https://www.amazon.in" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=amazon.in&sz=64" alt="Amazon" />
        </div>
        <span class="tile-title">Amazon</span>
      </a>

      <a href="https://music.apple.com" class="glass-tile">
        <div class="tile-icon">
          <img src="https://www.google.com/s2/favicons?domain=music.apple.com&sz=64" alt="Apple Music" />
        </div>
        <span class="tile-title">Apple Music</span>
      </a>
    </div>
  </main>

  <!-- Bottom-Left Greeting -->
  <div class="bottom-section">
    <div class="greeting-block">
      <div id="greeting-text" class="greeting-text">Good Morning, Vedanth</div>
      <div id="greeting-sub" class="greeting-sub">Let's build something great today.</div>
    </div>
  </div>

  <!-- Bottom-Right Hover-Expand Edit Button & Glass Menu -->
  <div class="bg-controls">
    <div id="bg-menu" class="glass-menu hidden">
      <button id="add-shortcut-btn" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          <path d="M10 17.5h-7M6.5 14v7"></path>
        </svg>
        Add Shortcut
      </button>

      <button id="add-bookmark-btn" class="menu-item menu-divider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          <line x1="12" y1="7" x2="12" y2="13"></line>
          <line x1="9" y1="10" x2="15" y2="10"></line>
        </svg>
        Add Bookmark
      </button>

      <button id="remove-shortcut-btn" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <line x1="14" y1="17.5" x2="21" y2="17.5"></line>
        </svg>
        Remove Shortcut
      </button>

      <button id="remove-bookmark-btn" class="menu-item menu-divider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          <line x1="9" y1="10" x2="15" y2="10"></line>
        </svg>
        Remove Bookmark
      </button>

      <button id="upload-img-btn" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        Set Image Wallpaper
      </button>

      <button id="upload-vid-btn" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        Set Live Video
      </button>

      <button id="reset-bg-btn" class="menu-item reset-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Reset Default
      </button>
    </div>

    <button id="edit-bg-btn" class="glass-edit-btn" title="Customize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span class="edit-label">Edit</span>
    </button>

    <input type="file" id="bg-img-input" accept="image/*" class="hidden" />
    <input type="file" id="bg-vid-input" accept="video/mp4,video/webm" class="hidden" />
  </div>

  <!-- Frosted Glass Modal -->
  <div id="custom-modal-overlay" class="modal-overlay hidden">
    <div class="glass-modal">
      <h3 id="modal-title" class="modal-title">Add Shortcut</h3>
      <form id="custom-item-form" autocomplete="off">
        <input type="text" id="item-name-input" class="modal-input" placeholder="Name (e.g., YouTube)" required maxlength="20" />
        <input type="text" id="item-url-input" class="modal-input" placeholder="URL (e.g., youtube.com)" required />
        <div class="modal-actions">
          <button type="button" id="modal-cancel-btn" class="modal-btn cancel-btn">Cancel</button>
          <button type="submit" class="modal-btn save-btn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
